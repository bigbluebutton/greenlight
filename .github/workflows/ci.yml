env:
  RUBY_VERSION: 3.3
  DATABASE_URL: postgres://postgres:postgres@localhost/greenlight-actions
  RAILS_ENV: test

name: CI
on:
  pull_request:
    branches: "*"

jobs:
  test:
    name: Rubocop + RSpec + ESLint + License Header Check
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        # Health checks to wait until postgres is ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bundler-cache runs `bundle install` and caches the gems keyed on Ruby version + Gemfile.lock
      - name: Install Ruby ${{ env.RUBY_VERSION }} and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      # Skip recommended packages (ghostscript, fonts, netpbm, ...): they make up most of the download
      # and aren't needed to process the image fixtures used by the specs.
      - name: Install imagemagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick

      - name: Setup Node with npm cache
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: NPM install
        run: npm ci

      - name: Setup database
        run: |
          bundler exec rails db:create
          bundler exec rails db:migrate

      - name: Run Rubocop
        run: bundle exec rubocop --parallel

      - name: Run RSpec
        run: bundle exec rspec

      - name: Run ESLint
        run: npx eslint app/javascript/* --ext .js,.jsx

      - name: Fix License Header
        uses: apache/skywalking-eyes/header@main
